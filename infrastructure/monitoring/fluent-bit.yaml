apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fluent-bit
  namespace: flux-system
spec:
  interval: 10m
  targetNamespace: monitoring
  chart:
    spec:
      chart: fluent-bit
      version: "0.58.2"
      sourceRef:
        kind: HelmRepository
        name: fluent
        namespace: flux-system
      interval: 1h
  values:
    config:
      outputs: |
        [OUTPUT]
            Name loki
            Match kube.*
            Host monitoring-loki.monitoring.svc.cluster.local
            Port 3100
            Labels job=fluent-bit,source=kubernetes
            Auto_Kubernetes_Labels On
            Retry_Limit False

        [OUTPUT]
            Name loki
            Match host.*
            Host monitoring-loki.monitoring.svc.cluster.local
            Port 3100
            Labels job=fluent-bit,source=node
            Retry_Limit False
