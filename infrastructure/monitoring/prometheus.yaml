apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus
  namespace: flux-system
spec:
  interval: 10m
  targetNamespace: monitoring
  chart:
    spec:
      chart: kube-prometheus-stack
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 1h
  values:
    grafana:
      enabled: false
    alertmanager:
      enabled: false
    prometheus:
      prometheusSpec:
        retention: 2h
        additionalScrapeConfigs:
          - job_name: kbot
            metrics_path: /metrics
            static_configs:
              - targets:
                  - kbot-metrics.flux-system.svc.cluster.local:8080
    prometheus-node-exporter:
      hostRootFsMount:
        enabled: false
